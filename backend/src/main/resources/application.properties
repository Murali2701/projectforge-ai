# Database Configuration (Railway & Local Environment Support)
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:${MYSQLPRIVATEURL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:projectforge}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:2701}}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server Port (Railway dynamically passes $PORT)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# JWT Configuration
jwt.secret=${JWT_SECRET:projectforgeaisupersecretjwtkey2026secure12345}
jwt.expiration=86400000

# Gemini AI API Key
gemini.api.key=${GEMINI_API_KEY:}